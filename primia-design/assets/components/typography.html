<!-- Typography — headings, body, link. Usa CSS variables de tokens.css -->
<style>
  .typography h1, .typography h2, .typography h3,
  .typography h4, .typography h5, .typography h6 {
    font-family: var(--font-display, var(--font-body, system-ui));
    color: var(--color-neutral-900, #171717);
    margin: 0 0 12px;
    font-weight: 700;
    line-height: 1.2;
  }
  .typography h1 { font-size: var(--text-5xl, 48px); }
  .typography h2 { font-size: var(--text-4xl, 36px); }
  .typography h3 { font-size: var(--text-3xl, 30px); }
  .typography h4 { font-size: var(--text-2xl, 24px); }
  .typography h5 { font-size: var(--text-xl, 20px); }
  .typography h6 { font-size: var(--text-lg, 18px); }
  .typography p {
    font-family: var(--font-body, system-ui);
    font-size: var(--text-md, 16px);
    line-height: 1.6;
    color: var(--color-neutral-800, #262626);
    margin: 0 0 16px;
  }
  .typography small {
    font-size: var(--text-sm, 14px);
    color: var(--color-neutral-600, #525252);
  }
  .typography a {
    color: var(--color-primary-600, #2563eb);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 2px;
  }
  .typography a:hover { color: var(--color-primary-700, #1d4ed8); }
  .typography code {
    font-family: var(--font-mono, ui-monospace, monospace);
    font-size: 0.9em;
    background: var(--color-neutral-100, #f5f5f5);
    color: var(--color-neutral-900, #171717);
    padding: 2px 6px;
    border-radius: var(--radius-sm, 4px);
  }
  .typography blockquote {
    border-left: 3px solid var(--color-primary-500, #3b82f6);
    padding: 8px 16px;
    margin: 16px 0;
    color: var(--color-neutral-700, #404040);
    font-style: italic;
  }
</style>

<div class="typography">
  <h1>Heading 1</h1>
  <h2>Heading 2</h2>
  <h3>Heading 3</h3>
  <h4>Heading 4</h4>
  <h5>Heading 5</h5>
  <h6>Heading 6</h6>
  <p>Body padrão. <a href="#">Link de exemplo</a> dentro do parágrafo. Use
  <code>code</code> pra trechos de código inline.</p>
  <small>Texto pequeno, geralmente usado em legendas.</small>
  <blockquote>Citação ou destaque. Mantém o ritmo da leitura mas chama atenção.</blockquote>
</div>
