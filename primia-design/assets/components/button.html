<!-- Button component — usa CSS variables de tokens.css -->
<style>
  .btn {
    font-family: var(--font-body, system-ui, sans-serif);
    font-weight: 500;
    font-size: var(--text-md, 16px);
    line-height: 1.2;
    padding: 10px 18px;
    border-radius: var(--radius-md, 8px);
    border: 1px solid transparent;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn:focus-visible {
    outline: 2px solid var(--color-primary-500, #3b82f6);
    outline-offset: 2px;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Variantes */
  .btn-primary {
    background: var(--color-primary-500, #3b82f6);
    color: var(--color-white, #fff);
    border-color: var(--color-primary-500, #3b82f6);
  }
  .btn-primary:hover:not(:disabled) { background: var(--color-primary-600, #2563eb); border-color: var(--color-primary-600, #2563eb); }
  .btn-primary:active:not(:disabled) { background: var(--color-primary-700, #1d4ed8); }

  .btn-secondary {
    background: var(--color-neutral-100, #f5f5f5);
    color: var(--color-neutral-900, #171717);
    border-color: var(--color-neutral-200, #e5e5e5);
  }
  .btn-secondary:hover:not(:disabled) { background: var(--color-neutral-200, #e5e5e5); }

  .btn-ghost {
    background: transparent;
    color: var(--color-primary-600, #2563eb);
    border-color: transparent;
  }
  .btn-ghost:hover:not(:disabled) { background: var(--color-primary-50, #eff6ff); }

  .btn-danger {
    background: var(--color-danger-500, #ef4444);
    color: var(--color-white, #fff);
    border-color: var(--color-danger-500, #ef4444);
  }
  .btn-danger:hover:not(:disabled) { background: var(--color-danger-600, #dc2626); }

  /* Tamanhos */
  .btn-sm { font-size: var(--text-sm, 14px); padding: 6px 12px; }
  .btn-lg { font-size: var(--text-lg, 18px); padding: 14px 24px; }
</style>

<button class="btn btn-primary">Primary</button>
<button class="btn btn-secondary">Secondary</button>
<button class="btn btn-ghost">Ghost</button>
<button class="btn btn-danger">Danger</button>
<button class="btn btn-primary btn-sm">Small</button>
<button class="btn btn-primary btn-lg">Large</button>
<button class="btn btn-primary" disabled>Disabled</button>
