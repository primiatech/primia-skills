<!-- Badge component — usa CSS variables de tokens.css -->
<style>
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 10px;
    border-radius: var(--radius-full, 9999px);
    font-family: var(--font-body, system-ui, sans-serif);
    font-size: var(--text-sm, 14px);
    font-weight: 500;
    line-height: 1.4;
  }
  .badge-primary  { background: var(--color-primary-100, #dbeafe); color: var(--color-primary-700, #1d4ed8); }
  .badge-success  { background: var(--color-success-100, #dcfce7); color: var(--color-success-700, #15803d); }
  .badge-warning  { background: var(--color-warning-100, #fef3c7); color: var(--color-warning-700, #b45309); }
  .badge-danger   { background: var(--color-danger-100, #fee2e2);  color: var(--color-danger-700, #b91c1c);  }
  .badge-info     { background: var(--color-info-100, #dbeafe);    color: var(--color-info-700, #1d4ed8);    }
  .badge-neutral  { background: var(--color-neutral-200, #e5e5e5); color: var(--color-neutral-800, #262626); }

  /* Variante "solid" — fundo cheio */
  .badge-solid.badge-primary  { background: var(--color-primary-500, #3b82f6);  color: var(--color-white, #fff); }
  .badge-solid.badge-success  { background: var(--color-success-500, #22c55e);  color: var(--color-white, #fff); }
  .badge-solid.badge-warning  { background: var(--color-warning-500, #f59e0b);  color: var(--color-white, #fff); }
  .badge-solid.badge-danger   { background: var(--color-danger-500, #ef4444);   color: var(--color-white, #fff); }
  .badge-solid.badge-info     { background: var(--color-info-500, #3b82f6);     color: var(--color-white, #fff); }
</style>

<span class="badge badge-primary">Primary</span>
<span class="badge badge-success">Success</span>
<span class="badge badge-warning">Warning</span>
<span class="badge badge-danger">Danger</span>
<span class="badge badge-info">Info</span>
<span class="badge badge-neutral">Neutral</span>

<span class="badge badge-solid badge-primary">Solid</span>
<span class="badge badge-solid badge-success">Solid</span>
